[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/ar/articles/travel-journals/"
  to = "/ar/articles/december-movies/"
  status = 301
  force = true

[[redirects]]
  from = "/en/articles/travel-journals/"
  to = "/en/articles/december-movies/"
  status = 301
  force = true
